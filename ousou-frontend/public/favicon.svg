<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- 品牌主渐变：青绿 → 金橙 → 火红 -->
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFD1"/>
      <stop offset="40%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <!-- 柔和发光滤镜，保证小尺寸下图标依然醒目 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 深色圆角底板，兼容浏览器深色/浅色标签页 -->
  <rect width="32" height="32" rx="6" fill="#0A0A12"/>

  <!-- 左侧起始信号源（光点） -->
  <circle cx="7" cy="16" r="3" fill="#00FFD1" filter="url(#glow)"/>

  <!-- 主线 S1：向下弯曲后上扬，代表速度与脉冲 -->
  <path d="M 7 16 C 14 28 24 6 28 14" 
        stroke="url(#favGrad)" stroke-width="3.5" fill="none" 
        stroke-linecap="round"/>

  <!-- 辅线 S2：向上弯曲后下探，与主线交织，增强动感 -->
  <path d="M 7 20 C 14 8 24 26 28 18" 
        stroke="url(#favGrad)" stroke-width="2" fill="none" 
        stroke-linecap="round" opacity=".65"/>
</svg>